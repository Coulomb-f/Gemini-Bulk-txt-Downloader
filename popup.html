<!-- File 2: popup.html -->
<!-- Now with separate buttons for single and bulk downloads. -->
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 280px;
            padding: 15px;
            background-color: #f9f9f9;
        }
        h3 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
            margin-bottom: 12px;
        }
        #downloadCurrentBtn {
            background-color: #34A853; /* Google Green */
            color: white;
            font-weight: 600;
        }
        #downloadCurrentBtn:hover {
            background-color: #2e9448;
        }
        #downloadAllBtn {
            background-color: #4285F4; /* Google Blue */
            color: white;
            font-weight: 600;
        }
        #downloadAllBtn:hover {
            background-color: #357ae8;
        }
        #clearHistoryBtn {
            background-color: #e0e0e0;
            color: #555;
            font-size: 12px;
            padding: 8px;
        }
        #clearHistoryBtn:hover {
            background-color: #d5d5d5;
        }
        #status {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h3>Gemini Exporter v0.4</h3>

    <button id="downloadCurrentBtn">Download Current Chat</button>
    <button id="downloadAllBtn">Download All New Chats</button>

    <div id="status">Ready to start.</div>
    <hr style="border: none; border-top: 1px solid #ddd; margin: 15px 0;">
    <button id="clearHistoryBtn">Clear Download History</button>

    <script src="popup.js"></script>
</body>
</html>
